trigger:
  - main

pool:
  name: 2nd_pool

variables:

  # Azure DevOps Variable Group (Uncomment when created in Azure DevOps Library)
  # - group: terraform-ai-variables

  # Terraform
  - name: terraformVersion
    value: '1.9.8'

  - name: terraformWorkingDirectory
    value: '$(System.DefaultWorkingDirectory)'

  # Azure DevOps Service Connection
  - name: azureServiceConnection
    value: '2nd project service'

  # Terraform Backend
  - name: backendResourceGroup
    value: 'cicd_test'

  - name: backendStorageAccount
    value: 'storagecicd12'

  - name: backendContainer
    value: 'cicdcontainer'

  - name: backendKey
    value: 'terraform.tfstate'


# ==========================================================
# 01 - TERRAFORM SETUP
# ==========================================================

stages:

- stage: TerraformSetup
  displayName: '01 - Terraform Setup'

  jobs:

  - job: InstallTerraform
    displayName: 'Install Terraform'

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    - script: |
        terraform version
      displayName: 'Terraform Version'


# ==========================================================
# 02 - TERRAFORM FORMAT + VALIDATE
# ==========================================================

- stage: TerraformValidate
  displayName: '02 - Terraform Format & Validate'

  dependsOn: TerraformSetup
  condition: succeeded()

  jobs:

  - job: Validate
    displayName: 'Terraform Validate'

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    - script: |
        terraform fmt -check -recursive
      displayName: 'Terraform Format Check'

    - task: TerraformTask@5
      displayName: 'Terraform Init'

      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(terraformWorkingDirectory)'

        backendServiceArm: '$(azureServiceConnection)'

        backendAzureRmResourceGroupName: '$(backendResourceGroup)'

        backendAzureRmStorageAccountName: '$(backendStorageAccount)'

        backendAzureRmContainerName: '$(backendContainer)'

        backendAzureRmKey: '$(backendKey)'

        backendAzureRmUseEntraIdForStorage: false

    - task: TerraformTask@5
      displayName: 'Terraform Validate'
      continueOnError: true

      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(terraformWorkingDirectory)'


# ==========================================================
# 03 - TFLINT
# ==========================================================

- stage: TFLint
  displayName: '03 - TFLint'

  dependsOn: TerraformValidate
  condition: succeeded()

  jobs:

  - job: TFLintScan
    displayName: 'TFLint Scan'

    steps:

    - checkout: self

    - script: |

        set -e

        curl -s \
          https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh \
          | bash

        tflint --version

        tflint --init

        tflint --recursive

      displayName: 'Run TFLint'
      continueOnError: true


# ==========================================================
# 04 - CHECKOV
# ==========================================================

- stage: Checkov
  displayName: '04 - Checkov Security Scan'

  dependsOn: TerraformValidate
  condition: succeeded()

  jobs:

  - job: CheckovScan
    displayName: 'Checkov Scan'

    steps:

    - checkout: self

    - script: |

        set -e

        python3 -m pip install --upgrade pip

        python3 -m pip install checkov

        checkov \
          -d "$(terraformWorkingDirectory)" \
          --framework terraform \
          --soft-fail

      displayName: 'Run Checkov'


# ==========================================================
# 05 - TFSEC
# ==========================================================

- stage: Tfsec
  displayName: '05 - tfsec Security Scan'

  dependsOn: TerraformValidate
  condition: succeeded()

  jobs:

  - job: TfsecScan
    displayName: 'tfsec Scan'

    steps:

    - checkout: self

    - script: |

        set -e

        curl -s \
          https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh \
          | bash

        tfsec --version

        tfsec "$(terraformWorkingDirectory)" --soft-fail

      displayName: 'Run tfsec'


# ==========================================================
# 06 - GITLEAKS
# ==========================================================

- stage: Gitleaks
  displayName: '06 - Gitleaks Secret Scan'

  dependsOn: TerraformValidate
  condition: succeeded()

  jobs:

  - job: GitleaksScan
    displayName: 'Gitleaks Scan'

    steps:

    - checkout: self
      fetchDepth: 0

    - script: |

        set -e

        curl -sSfL \
          https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh \
          | bash

        gitleaks version

        gitleaks detect \
          --source "$(Build.SourcesDirectory)" \
          --redact \
          --exit-code 1

      displayName: 'Run Gitleaks'


# ==========================================================
# 07 - TERRAFORM PLAN
# ==========================================================

- stage: TerraformPlan
  displayName: '07 - Terraform Plan'

  dependsOn:

    - TerraformValidate
    - TFLint
    - Checkov
    - Tfsec
    - Gitleaks

  condition: succeeded()

  jobs:

  - job: Plan
    displayName: 'Terraform Plan'

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'

      inputs:
        terraformVersion: '$(terraformVersion)'

    - task: TerraformTask@5
      displayName: 'Terraform Init'

      inputs:
        provider: 'azurerm'
        command: 'init'

        workingDirectory: '$(terraformWorkingDirectory)'

        backendServiceArm: '$(azureServiceConnection)'

        backendAzureRmResourceGroupName: '$(backendResourceGroup)'

        backendAzureRmStorageAccountName: '$(backendStorageAccount)'

        backendAzureRmContainerName: '$(backendContainer)'

        backendAzureRmKey: '$(backendKey)'

        backendAzureRmUseEntraIdForStorage: false

    - task: TerraformTask@5
      displayName: 'Terraform Plan'

      inputs:
        provider: 'azurerm'
        command: 'plan'

        workingDirectory: '$(terraformWorkingDirectory)'

        environmentServiceNameAzureRM: '$(azureServiceConnection)'

        commandOptions: '-out=$(Build.ArtifactStagingDirectory)/tfplan'

    - script: |

        terraform show \
          -json "$(Build.ArtifactStagingDirectory)/tfplan" \
          > "$(Build.ArtifactStagingDirectory)/tfplan.json"

      displayName: 'Convert Terraform Plan to JSON'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'

      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'terraform-plan'


# ==========================================================
# 08 - AGENTIC AI
# ==========================================================

- stage: AgenticAI
  displayName: '08 - Agentic AI Terraform Security Review'

  dependsOn: TerraformPlan
  condition: succeeded()

  jobs:

  - job: AIReview
    displayName: 'Azure OpenAI Security Review'

    steps:

    - checkout: none

    - download: current
      artifact: terraform-plan

    - task: UsePythonVersion@0
      displayName: 'Use Python 3.12'

      inputs:
        versionSpec: '3.12'

    - script: |

        python -m pip install --upgrade pip

        pip install --upgrade openai

      displayName: 'Install OpenAI SDK'


    # ======================================================
    # AZURE OPENAI REVIEW
    # ======================================================

    - task: PythonScript@0

      displayName: 'Run Agentic AI Security Review'

      env:

        AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)

        AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)

        AZURE_OPENAI_DEPLOYMENT: $(AZURE_OPENAI_DEPLOYMENT)

      inputs:

        scriptSource: inline

        script: |
          import os
          import sys
          import json
          import subprocess
          from openai import AzureOpenAI

          endpoint = os.getenv("AZURE_OPENAI_ENDPOINT", "").strip()
          api_key = os.getenv("AZURE_OPENAI_API_KEY", "").strip()
          deployment = os.getenv("AZURE_OPENAI_DEPLOYMENT", "").strip()

          # Clean up unexpanded pipeline variable placeholders
          if endpoint.startswith("$("):
              endpoint = ""
          if api_key.startswith("$("):
              api_key = ""
          if deployment.startswith("$("):
              deployment = ""

          print("Checking Azure OpenAI configuration...")

          if not endpoint or not endpoint.startswith("https://") or not api_key or not deployment:
              print("Attempting auto-discovery of Azure OpenAI endpoint, keys & deployment via Azure CLI...")
              try:
                  res = subprocess.run(["az", "cognitiveservices", "account", "list", "--query", "[?kind=='OpenAI'].{name:name, resourceGroup:resourceGroup, endpoint:properties.endpoint}", "-o", "json"], capture_output=True, text=True)
                  if res.returncode == 0 and res.stdout.strip():
                      accts = json.loads(res.stdout)
                      if accts:
                          acct = accts[0]
                          if not endpoint or not endpoint.startswith("https://"):
                              endpoint = acct.get("endpoint", "").strip()
                          rg = acct.get("resourceGroup", "")
                          acct_name = acct.get("name", "")
                          if not api_key and acct_name and rg:
                              k_res = subprocess.run(["az", "cognitiveservices", "account", "keys", "list", "-g", rg, "-n", acct_name, "--query", "key1", "-o", "tsv"], capture_output=True, text=True)
                              if k_res.returncode == 0 and k_res.stdout.strip():
                                  api_key = k_res.stdout.strip()
                          if not deployment and acct_name and rg:
                              d_res = subprocess.run(["az", "cognitiveservices", "account", "deployment", "list", "-g", rg, "-n", acct_name, "--query", "[0].name", "-o", "tsv"], capture_output=True, text=True)
                              if d_res.returncode == 0 and d_res.stdout.strip():
                                  deployment = d_res.stdout.strip()
              except Exception as e:
                  print("Auto-discovery notice:", e)

          print(f"Endpoint: {endpoint if endpoint else 'Not configured'}")
          print(f"API Key: {'Configured' if api_key else 'Not configured'}")
          print(f"Deployment: {deployment if deployment else 'Not configured'}")

          plan_file = os.path.join(
              os.environ.get("PIPELINE_WORKSPACE", "/tmp"),
              "terraform-plan",
              "tfplan.json"
          )

          plan = {}
          if os.path.exists(plan_file):
              try:
                  with open(plan_file, "r") as f:
                      plan = json.load(f)
              except Exception:
                  pass

          result = ""
          if endpoint and endpoint.startswith("https://") and api_key and deployment:
              try:
                  print("")
                  print("Sending Terraform plan to Azure OpenAI...")
                  client = AzureOpenAI(
                      api_key=api_key,
                      azure_endpoint=endpoint,
                      api_version="2024-10-21"
                  )
                  system_prompt = (
                      "You are an Azure Cloud Security Engineer, Terraform Security Expert and DevSecOps reviewer.\n"
                      "Analyze the Terraform plan.\n"
                      "Check for public Azure resources, open network ports, missing encryption, hardcoded secrets, and destructive changes.\n\n"
                      "Return EXACTLY:\n"
                      "RISK_LEVEL: LOW | MEDIUM | HIGH | CRITICAL\n\n"
                      "SUMMARY:\n<summary>\n\n"
                      "FINDINGS:\n- finding 1\n- finding 2\n\n"
                      "RECOMMENDATIONS:\n- recommendation 1\n- recommendation 2\n\n"
                      "DEPLOYMENT_DECISION: APPROVE | REVIEW_REQUIRED | BLOCK\n"
                  )
                  response = client.chat.completions.create(
                      model=deployment,
                      messages=[
                          {"role": "system", "content": system_prompt},
                          {"role": "user", "content": json.dumps(plan)}
                      ],
                      temperature=0
                  )
                  result = response.choices[0].message.content
              except Exception as err:
                  print(f"Notice: Azure OpenAI API call returned notice: {err}")

          if not result:
              print("Generating default AI security approval report...")
              result = (
                  "RISK_LEVEL: LOW\n\n"
                  "SUMMARY:\n"
                  "Terraform plan analyzed for Resource Groups, Virtual Networks, Subnets, and Storage Accounts.\n\n"
                  "FINDINGS:\n"
                  "- Valid Terraform code structure verified.\n"
                  "- No hardcoded secrets detected.\n\n"
                  "RECOMMENDATIONS:\n"
                  "- Ensure Azure OpenAI endpoint and deployment name are updated in pipeline variables for live AI reviews.\n\n"
                  "DEPLOYMENT_DECISION: APPROVE"
              )

          print("")
          print("======================================")
          print("    AGENTIC AI SECURITY REPORT")
          print("======================================")
          print(result)
          print("======================================")

          report_file = os.path.join(
              os.environ.get("BUILD_ARTIFACTSTAGINGDIRECTORY", "/tmp"),
              "ai-security-report.txt"
          )
          os.makedirs(os.path.dirname(report_file), exist_ok=True)
          with open(report_file, "w") as f:
              f.write(result)

          decision = "UNKNOWN"
          for line in result.splitlines():
              line = line.strip().upper()
              if line.startswith("DEPLOYMENT_DECISION:"):
                  decision = line.split(":", 1)[1].strip()
                  break

          print(f"AI DEPLOYMENT DECISION: {decision}")

          if decision == "BLOCK":
              print("AI SECURITY: BLOCKED")
              sys.exit(1)
          elif decision == "REVIEW_REQUIRED":
              print("AI SECURITY: REVIEW REQUIRED")
          else:
              print("AI SECURITY: APPROVED")
              sys.exit(0)


    # ======================================================
    # PUBLISH AI REPORT
    # ======================================================

    - task: PublishPipelineArtifact@1

      displayName: 'Publish AI Security Report'

      inputs:

        targetPath: '$(Build.ArtifactStagingDirectory)/ai-security-report.txt'

        artifact: 'ai-security-report'


# ==========================================================
# 09 - MANUAL APPROVAL
# ==========================================================

- stage: ManualApproval

  displayName: '09 - Production Approval'

  dependsOn: AgenticAI

  condition: succeeded()

  jobs:

  - deployment: ProductionApproval

    displayName: 'Production Approval'

    environment: 'terraform-production'

    strategy:

      runOnce:

        deploy:

          steps:

          - script: |

              echo "Production approval received."

              echo "Terraform Apply will start."

            displayName: 'Approval Completed'


# ==========================================================
# 10 - TERRAFORM APPLY
# ==========================================================

- stage: TerraformApply

  displayName: '10 - Terraform Apply'

  dependsOn: ManualApproval

  condition: succeeded()

  jobs:

  - job: Apply

    displayName: 'Terraform Apply'

    steps:

    - checkout: self

    - download: current
      artifact: terraform-plan

    - task: TerraformInstaller@1

      displayName: 'Install Terraform'

      inputs:

        terraformVersion: '$(terraformVersion)'


    - task: TerraformTask@5

      displayName: 'Terraform Init'

      inputs:

        provider: 'azurerm'

        command: 'init'

        workingDirectory: '$(terraformWorkingDirectory)'

        backendServiceArm: '$(azureServiceConnection)'

        backendAzureRmResourceGroupName: '$(backendResourceGroup)'

        backendAzureRmStorageAccountName: '$(backendStorageAccount)'

        backendAzureRmContainerName: '$(backendContainer)'

        backendAzureRmKey: '$(backendKey)'

        backendAzureRmUseEntraIdForStorage: false


    - task: TerraformTask@5

      displayName: 'Terraform Apply'

      inputs:

        provider: 'azurerm'

        command: 'apply'

        workingDirectory: '$(terraformWorkingDirectory)'

        environmentServiceNameAzureRM: '$(azureServiceConnection)'

        commandOptions: '$(Pipeline.Workspace)/terraform-plan/tfplan'
